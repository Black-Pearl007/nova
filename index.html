<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova - Your Friendly AI Companion</title>
<style>
:root{--bg:#0b1020;--bg2:#121a35;--panel:rgba(22,31,64,.8);--bd:#2a3768;--ink:#e8edff;--muted:#9aa7d6;--accent:#4de1ff;--accent2:#a78bfa;--user:#4de1ff;--user-t:#061226;--warn:#ffd166;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef3ff;--bg2:#dfe8ff;--panel:rgba(255,255,255,.92);--bd:#c3d0ee;--ink:#14204a;--muted:#55639a;--accent:#0a86c9;--accent2:#6d4fe0;--user:#14204a;--user-t:#ffffff;--warn:#b86e00}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 80% -10%,var(--bg2),transparent 60%),radial-gradient(900px 500px at -10% 110%,var(--bg2),transparent 60%),var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;overflow:hidden}
.app{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--bd);backdrop-filter:blur(8px)}
.orb{width:44px;height:44px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff,var(--accent) 35%,var(--accent2));box-shadow:0 0 14px var(--accent);animation:idle 4s ease-in-out infinite}
header.listening .orb{animation:pulse .8s ease-in-out infinite;box-shadow:0 0 22px #ff6b6b;background:radial-gradient(circle at 35% 30%,#fff,#ff6b6b 40%,var(--accent2))}
header.speaking .orb{animation:pulse .5s ease-in-out infinite;box-shadow:0 0 26px var(--accent)}
header.thinking .orb{animation:pulse 1s ease-in-out infinite}
@keyframes idle{50%{transform:scale(1.06)}}
@keyframes pulse{50%{transform:scale(1.2)}}
h1{font-size:1.1rem;margin:0;line-height:1.2}
header small{display:block;color:var(--muted);font-size:.78rem}
.sp{flex:1}
button{font:inherit;cursor:pointer}
.icon{background:none;border:1px solid var(--bd);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:.85rem}
.icon:hover{border-color:var(--accent)}
.icon[aria-pressed="true"]{background:var(--accent);color:var(--user-t);border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{max-width:86%;padding:10px 14px;border-radius:16px;border:1px solid var(--bd);white-space:pre-line;overflow-wrap:anywhere;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.bot{align-self:flex-start;background:var(--panel);border-bottom-left-radius:4px}
.me{align-self:flex-end;background:var(--user);color:var(--user-t);border-color:var(--user);border-bottom-right-radius:4px}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.msg a.lnk{display:inline-block;margin:6px 6px 0 0;padding:5px 12px;border-radius:999px;background:var(--accent);color:var(--user-t);text-decoration:none;font-weight:700;font-size:.85rem}
.msg a.lnk:hover{filter:brightness(1.1)}
.qr{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:92%;animation:pop .25s ease-out}
.chip{background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:5px 13px;font-weight:600;font-size:.88rem}
.chip:hover{background:var(--accent);color:var(--user-t)}
.chips{display:flex;gap:8px;padding:0 14px 8px;overflow-x:auto;scrollbar-width:none}
.chips .chip{white-space:nowrap}
.bar{display:flex;gap:8px;padding:12px 14px;background:var(--panel);border-top:1px solid var(--bd)}
.bar input{flex:1;min-width:0;font:inherit;padding:10px 14px;border:1px solid var(--bd);border-radius:999px;background:var(--bg);color:var(--ink)}
.send,.mic{border:0;border-radius:999px;padding:0 18px;font-weight:700;background:var(--accent);color:var(--user-t)}
.mic{width:44px;padding:0;background:transparent;border:1px solid var(--bd);color:var(--ink);font-size:1.1rem}
.mic.on{background:#ff6b6b;border-color:#ff6b6b;color:#fff}
.moodrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mood{font-size:1.6rem;line-height:1;background:transparent;border:1px solid var(--bd);border-radius:14px;padding:8px 10px;transition:transform .15s}
.mood:hover{transform:scale(1.18) rotate(-4deg);border-color:var(--accent)}
.breath{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0 8px}
.bc{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--accent) 40%,var(--accent2));box-shadow:0 0 18px var(--accent)}
.bl{font-weight:700;color:var(--accent)}
.note{margin-top:6px;font-size:.74rem;color:var(--muted);font-style:italic}
.cf{position:fixed;top:-14px;width:8px;height:12px;border-radius:2px;z-index:60;pointer-events:none;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--bg2);color:var(--ink);width:min(94vw,460px);padding:18px;max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(3,6,20,.65)}
dialog h2{margin:0 0 4px;font-size:1.1rem}
dialog p{margin:0 0 8px;color:var(--muted);font-size:.88rem}
label{display:block;font-size:.82rem;font-weight:600;margin:10px 0 3px}
dialog input,dialog select{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.danger{border-color:#ff6b6b;color:#ff6b6b}
@media (max-width:520px){.msg{max-width:94%}header small{display:none}.icon{padding:6px 8px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header id="hdr">
    <div class="orb" aria-hidden="true"></div>
    <div><h1 id="title">Nova</h1><small id="sub">Your friendly companion</small></div>
    <div class="sp"></div>
    <button class="icon" id="talkBtn" type="button" aria-pressed="false" aria-label="Toggle hands-free talk mode">Talk mode</button>
    <button class="icon" id="voiceBtn" type="button" aria-pressed="false" aria-label="Toggle spoken replies">Voice off</button>
    <button class="icon" id="settingsBtn" type="button" aria-label="Open settings">Settings</button>
  </header>
  <div id="log" role="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form class="bar" id="form" onsubmit="return false">
    <button class="mic" id="mic" type="button" aria-label="Speak your message" title="Speak">&#127908;</button>
    <input id="q" type="text" placeholder="Talk to me about anything..." autocomplete="off" aria-label="Your message">
    <button class="send" id="go" type="button">Send</button>
  </form>
</div>

<dialog id="dlg">
  <h2>Settings</h2>
  <p>Everything is saved only in this browser.</p>
  <div id="fields"></div>
  <div class="row">
    <button class="icon danger" id="wipe" type="button">Erase my saved data</button>
    <span><button class="icon" id="cancel" type="button">Cancel</button> <button class="send" id="save" type="button" style="padding:8px 18px">Save</button></span>
  </div>
</dialog>

<script src="model.js"></script>

 {id:"study",re:/\b(study|studying|revise|revision|homework|assignment|learn faster|memori[sz]e)\b/,tips:["Try the 25/5 method: 25 minutes of focused study, then a 5 minute break. Do four rounds, then take a longer rest.","Test yourself instead of rereading. Close the book and write down what you remember, it sticks far better.","Teach the topic to an imaginary friend in simple words. Wherever you get stuck is what to revise.","Study the hardest subject first, when your energy is highest."]},

/* ---------- learned intent classifier (trained offline by nlp/train.py) ---------- */
var NLP=(function(){
  var M=window.NOVA_MODEL;
  if(!M)return {ready:false,classify:function(){return null;}};
  var maps=M.blocks.map(function(b){var m={};for(var i=0;i<b.terms.length;i++)m[b.terms[i]]=i;return m;});
  var offsets=[],tot=0;M.blocks.forEach(function(b){offsets.push(tot);tot+=b.terms.length;});
  function prep(s){return s.toLowerCase().replace(/’/g,"'").replace(/'/g,"");}
  function grams(b,text){
    var out=[],i,n;
    if(b.analyzer==="char_wb"){
      var words=text.replace(/\s+/g," ").trim().split(" ");
      words.forEach(function(w){
        if(!w)return;w=" "+w+" ";var L=w.length;
        for(n=b.ngram[0];n<=b.ngram[1];n++){
          var off=0;out.push(w.substr(off,n));
          while(off+n<L){off++;out.push(w.substr(off,n));}
          if(off===0)break;
        }
      });
    }else{
      var tk=text.match(/\b\w\w+\b/g)||[];
      for(n=b.ngram[0];n<=b.ngram[1];n++)for(i=0;i+n<=tk.length;i++)out.push(tk.slice(i,i+n).join(" "));
    }
    return out;
  }
  function classify(raw){
    var text=prep(raw),feats=[];
    M.blocks.forEach(function(b,bi){
      var cnt={};grams(b,text).forEach(function(g){var ix=maps[bi][g];if(ix!==undefined)cnt[ix]=(cnt[ix]||0)+1;});
      var norm=0,vals=[];
      for(var k in cnt){var v=cnt[k]*b.idf[k];vals.push([+k,v]);norm+=v*v;}
      norm=Math.sqrt(norm)||1;
      vals.forEach(function(p){feats.push([offsets[bi]+p[0],p[1]/norm]);});
    });
    if(!feats.length)return null;
    var logits=M.coef.map(function(row,c){var s=M.intercept[c];for(var i=0;i<feats.length;i++)s+=row[feats[i][0]]*feats[i][1];return s;});
    var mx=Math.max.apply(null,logits),ex=logits.map(function(z){return Math.exp(z-mx);}),sum=ex.reduce(function(a,b){return a+b;},0);
    var p=ex.map(function(e){return e/sum;}),best=0;
    for(var j=1;j<p.length;j++)if(p[j]>p[best])best=j;
    return {label:M.labels[best],p:p[best],all:p};
  }
  return {ready:true,classify:classify,threshold:M.threshold};
})();

var NAME_RE=/(?:my name is|call me|i am called|i['’]?m called)\s+([a-z][a-z' ]{0,20})/i;

function lifeReply(text){
  var mood=null,topic=null,i;
  for(i=0;i<MOODS.length;i++)if(MOODS[i].re.test(text)){mood=MOODS[i];break;}
  for(i=0;i<TOPICS.length;i++)if(TOPICS[i].re.test(text)){topic=TOPICS[i];break;}
  if(!mood&&!topic)return null;
  var parts=[],chips,fx=false;
  if(mood){parts.push(nextOf("m_"+mood.id,mood.lines));chips=mood.chips;ctx.mood=mood.neg?mood.id:null;fx=!!mood.fx;}
  if(topic){parts.push((mood?"Here’s something that might help: ":"")+nextOf("tip_"+topic.id,topic.tips));last={run:function(){return adviceReply(topic);}};chips=mood?chips:["Another tip","Play some music","Tell me a joke"];}
  else last=null;
  return {t:parts.join("\n\n"),chips:chips,confetti:fx};
}

function handle(raw,viaNlp){
  var low=raw.toLowerCase().trim();
  if(CRISIS.test(raw)){pending=null;return crisisReply();}
  if(pending&&/^(stop|quit|exit|cancel|enough|never ?mind|skip|menu|back)$/.test(low)){pending=null;return {t:"No problem! 🙂 What would you like to do next?",chips:["Play a game","Play music","Give me advice","Tell me a joke"]};}
  if(pending){var p=pending;pending=null;var r0=p(low,raw);if(r0)return r0;}
  var nm1=NAME_RE.exec(raw);if(nm1)return setName(raw,nm1);
  var life=lifeReply(low);
  for(var i=0;i<INTENTS.length;i++){
    var it=INTENTS[i];
    if(life&&!it.cmd)continue;
    var m=it.re.exec(raw);
    if(m){var r=it.run(m,raw);if(r)return r;}
  }
  if(life)return life;
  if(!viaNlp&&NLP.ready){
    var c=NLP.classify(raw);
    if(c&&c.p>=NLP.threshold&&NLP_MAP[c.label]){
      var label=c.label,note="Understood as \u2018"+label+"\u2019 ("+Math.round(c.p*100)+"% sure) by the learned model";
      if(c.p<0.45){
        pending=function(t2){
          if(/^(yes|yeah|yep|yup|sure|correct|right|ya)\b/.test(t2)){var r2=handle(NLP_MAP[label],true);if(typeof r2==="string")r2={t:r2};r2.note=note+" (you confirmed)";return r2;}
          if(/^(no|nope|nah|something else|not really)\b/.test(t2))return {t:"Okay, thanks for telling me. Could you say it another way? \ud83d\ude42",chips:["Play a game","Give me advice","Play music","What can you do?"]};
          return null;
        };
        return {t:"I want to get this right. Did you mean "+FRIENDLY[label]+"?",chips:["Yes","Something else"],note:note};
      }
      var rr=handle(NLP_MAP[label],true);
      if(typeof rr==="string")rr={t:rr};
      rr.note=note;
      return rr;
    }
  }
  return {t:pick(["Hmm, I’m not sure I understood that, but I’m listening. 🙂 Want to tell me more, or try one of these?","I’m a simple bot, so I may have missed that. I can chat, play games, give advice, suggest music and more. What would you like?"]),chips:["Play a game","Give me advice","Play music","What can you do?"]};
}

var idleT=null,nudges=0;
function resetIdle(){clearTimeout(idleT);if(nudges<2)idleT=setTimeout(function(){nudges++;var m=pick(["Still here if you want to chat"+nm()+". 🙂 Want a joke or a game?","Psst… take a sip of water and stretch for a moment. 💧 Want to play something?"]);add(m,"bot",{chips:["Tell me a joke","Play a game","Play music"]});speak(m);},120000);}

function ask(text){
  text=(text||"").trim();if(!text)return;
  if(synth)synth.cancel();
  add(text,"me");resetIdle();
  var t=typingBubble();
  var r=handle(text);if(typeof r==="string")r={t:r};
  var delay=Math.min(1100,400+(r.t||"").length*4);
  setTimeout(function(){
    t.remove();hdr.classList.remove("thinking");
    add(r.t,"bot",{links:r.links,chips:r.chips,node:r.node,note:r.note});
    if(r.confetti)confetti();
    speak(r.t);
  },delay);
}

function nameCapture(t,raw){
  if(/^\s*(skip|later|no|nope|none)\s*$/.test(t))return {t:"No worries, I’ll just call you friend! 😊 You can tell me later with ‘call me …’. How are you feeling right now?",node:moodRow()};
  var s=raw.replace(/^(?:hi|hello|hey)[, ]*/i,"").replace(/^(?:my name is|i am|i['’]m|im|call me|it['’]?s|this is)\s+/i,"").replace(/[^A-Za-z' ]/g,"").trim();
  var w=s.split(/\s+/);

  var n=w[0];n=n.charAt(0).toUpperCase()+n.slice(1).toLowerCase();
